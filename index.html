 v.innerHTML=`<div class=box><h3>Cementerio (${n})${np>1?' · '+(pg+1)+'/'+np:''}</h3><div class="lst g">${cells.join('')}</div><div class=btns><button ${pg>0?'':'disabled'} onclick=gvv(${pg-1})>‹</button><button onclick=viewX()>Cerrar</button><button ${pg<np-1?'':'disabled'} onclick=gvv(${pg+1})>›</button></div></div>`;v.className='on';fixImgs(v);
 if(fresh&&v.firstChild.animate)v.firstChild.animate([{transform:'scale(.85)',opacity:0},{transform:'none',opacity:1}],{duration:200})}
function surL(){const v=$('#view');v.innerHTML='<div class=box><p>¿Deseas rendirte?</p><div class=btns><button onclick=viewX()>Cancelar</button><button class=bad onclick=surGo()>Aceptar</button></div></div>';v.className='on'}
function surGo(){viewX();if(NET.on&&NET.role=='guest')NET.dc.send(JSON.stringify({t:'sur'}));else out(LV(),'se rindió')}
function fixImgs(r){r.querySelectorAll('img[data-id]').forEach(im=>{const id=im.dataset.id,big=im.closest('.card.lg,.card.md,.card.xl');im.src=(!big&&TH[id])||'assets/cards/'+id+'.png'})}

/* ===== Modo Vs IA ===== */
let AIM=null,AI={n:'',f:0,lv:'normal'};const LVN={easy:'Fácil',normal:'Normal',hard:'Difícil',imp:'Imposible'};
const isBot=i=>!!(G&&G.ai&&!G.over&&i==G.bi);
const cv=c=>{const B=G.ps[G.bi];return({s:10,h:B&&B.sl[OR.indexOf(c.k)]?3:9,w:6,a:6,d:5,m:4,t:4,x:5,l:G.lv=='imp'?7:1})[c.t]||1};
function helpV(){modal('<h3>Modo Vs IA</h3><p class=sm>Juegas tú solo contra la máquina. Escribe tu nombre, elige la dificultad y toca "Empezar partida".<br><br><b>Fácil:</b> la IA solo invoca herederos y de vez en cuando ataca.<br><b>Normal:</b> usa herederos, cartas de ataque y mágicas.<br><b>Difícil:</b> usa todas las cartas y efectos para ganar.<br><b>Imposible:</b> usa absolutamente todas las cartas, incluido el Reloj del Linaje Eterno, y aprovecha todo para ganar.<br><br>El tiempo es indefinido: no hay cronómetro.</p><div class=btns><button onclick=closeM()>Cerrar</button></div>')}
function aiCfg(){modal(`<div class=panel><h3>Jugador</h3><div class=pr><input id=an2 placeholder="Tu nombre" value="${AI.n}" ${AI.f?'readonly':''}><button class="${AI.f?'x':'ok'}" onclick=afix()>${AI.f?'✕':'✓'}</button></div></div><div class=panel><h3>Dificultad</h3><p class=sm>${LVN[AI.lv]}</p><button onclick=aiLv()>Configurar</button></div><div class=panel><h3>Tiempo</h3><p class=sm>Indefinido</p></div><button class="pri big" onclick=aiStart()>Empezar partida</button><button style="margin-top:10px;width:100%" onclick=closeM()>Regresar</button>`)}
function afix(){if(AI.f){AI.f=0;AI.n=''}else{AI.n=($('#an2').value||'').trim()||'Jugador';AI.f=1}aiCfg()}
function aiLv(){modal('<h3>Dificultad</h3><div class="btns col"><button onclick="aiSet(\'easy\')">Fácil</button><button onclick="aiSet(\'normal\')">Normal</button><button onclick="aiSet(\'hard\')">Difícil</button><button onclick="aiSet(\'imp\')">Imposible</button></div>')}
function aiSet(l){AI.lv=l;aiCfg()}
function aiStart(){if(!AI.f)return toast('Confirma tu nombre con ✓');const pl=SET.pl,tm=SET.tm;SET.pl=[AI.n,'IA'];SET.tm=Infinity;AIM=AI.lv;start();SET.pl=pl;SET.tm=tm}
// ---- turno de la IA ----
function botNext(d){if(!G||!G.ai||G.over||G.cur!=G.bi||!G.run||G.bq)return;G.bq=1;setTimeout(()=>{G.bq=0;botStep()},d||1000)}
function botStep(){if(!G||G.over||!G.ai||G.cur!=G.bi||!G.run)return;if(LK||G.mh||G.tg)return botNext(500);if(++G.bn>14)return botEnd();
 const A=botPlan();if(!A)return botEnd();const sg=G.bs=(G.bs||0)+1;A();setTimeout(()=>{if(G&&G.bs==sg&&G.ai&&G.cur==G.bi&&!G.over&&!G.mh&&!LK)botStep()},8000)}
function botEnd(){G.tp=null;endTurn()}
function botPlan(){const B=G.bi,p=G.ps[B],hu=G.ps[G.hi],lv=G.lv,imp=lv=='imp',hp=lv=='hard'||imp,hand=p.hand,P=(c,src)=>canPlay(B,c,src||'hand'),run=(c,src)=>()=>{G.sel={c,src:src||'hand'};act()},
 heirs=hand.filter(c=>c.t=='h'&&canSummon(c)),atk=hand.filter(c=>c.t=='a'&&P(c)),sr=hand.find(c=>c.t=='s'&&P(c)),def=hand.filter(c=>c.t=='d'&&P(c)),thr=h=>h&&(h.sr||h.atk.length),
 sm=()=>heirs.length&&(()=>{G.sel={c:heirs[0],src:'hand'};summon()}),
 hw=hp&&hand.find(c=>c.t=='w'&&canSummon(c)),ws=()=>hw&&(()=>{G.sel={c:hw,src:'hand'};sum2([0,1,2,3].find(i=>!p.sl[i]))}),
 at=()=>{if(!atk.length||(lv=='easy'&&Math.random()>=.4))return false;return run(imp?(atk.find(c=>hu.sl.some(h=>thr(h)&&(!c.k||h.as==c.k)))||atk[0]):atk[Math.random()*atk.length|0])},
 sa=()=>sr&&run(sr),
 cl=()=>{const c=def.find(c=>p.sl.some(h=>h&&h.atk.length&&(!c.k||h.as==c.k)));return c&&run(c)},
 df=()=>def.length&&hand.length>(imp?0:2)&&run(def[0]),
 mg=()=>{const ok={tributo_al_rey:hand.length<=4,pacto_del_consejo:p.sl.filter(Boolean).length<=hu.sl.filter(Boolean).length,edicto_de_la_corte:hu.hid.length>0&&!p.hid.length,titiritero_del_reino:true,usurpador_de_tumbas:true,ritual_del_linaje:hp&&p.sl.some(h=>h&&h.atk.length)},m=hand.find(c=>c.t=='m'&&P(c)&&ok[c.id]);return m&&run(m)},
 hd=()=>{const c=p.hid.find(c=>'asd'.includes(c.t)&&P(c,'hid'));return c&&run(c,'hid')},
 rl=(c=>{if(c&&!c.ch)c.ch=[];return c})(p.hid.find(c=>c.t=='l')),
 rc=()=>{if(!imp||!rl||rl.ch.length>=3)return false;const junk=hand.filter(x=>x.t=='l'||(x.t=='h'&&p.sl[OR.indexOf(x.k)])||(x.t=='w'&&!hw&&p.sl.every(Boolean))).slice(0,3-rl.ch.length);return junk.length&&(()=>{junk.forEach(x=>{hand.splice(hand.indexOf(x),1);rl.ch.push(x)});render();botNext()})},
 ra=only=>{if(!imp||!rl||rl.ch.length<3||(only&&!sr))return false;const k=sr?2:hand.length<=2?1:3;return()=>{G.sel={c:rl,src:'hid'};rfx(k);botNext()}},
 pl=()=>{const c=p.hid.length<3&&hand.find(c=>c.t=='t'||c.t=='x'||(imp&&c.t=='l'&&!rl)||('ad'.includes(c.t)&&!P(c)));return c&&(()=>{G.sel={c,src:'hand'};place();botNext()})};
 if(lv=='easy')return sm()||at()||null;
 if(lv=='normal')return sm()||sa()||at()||mg()||null;
 if(imp)return ra(1)||sa()||sm()||ws()||ra()||rc()||cl()||hd()||at()||df()||mg()||pl()||null;
 return sa()||sm()||ws()||cl()||hd()||at()||df()||mg()||pl()||null}
// ---- decisiones de la IA ----
function botSel(ok,cb,c){const L=[];G.ps.forEach((q,i)=>[0,1,2,3].forEach(s=>{if(q.alive&&ok(i,s))L.push({i,s,h:q.sl[s]})}));if(!L.length)return;
 const sc=o=>{const h=o.h;let v=Math.random();if(c&&c.id=='maniobra_real')return v+(o.i==G.hi?10:-10)-h.def.length;if(c&&(c.t=='a'||c.id=='titiritero_del_reino'))return v+(h.sr?20:0)+h.atk.length*8-h.def.length*3;if(c&&c.t=='d')return v+(h.sr?20:0)+(h.atk.length?15:0)+(3-h.def.length);if(c&&c.t=='s')return v+h.def.length;return v-h.atk.length*5-h.def.length-(h.sr?20:0)};
 L.sort((a,b)=>sc(b)-sc(a));setTimeout(()=>cb(L[0].i,L[0].s),500)}
function botGp(o){const idx=o.items.map((_,i)=>i).filter(i=>o.items[i].ok!==false);if(!idx.length)return closeM(o.skip);const v=i=>o.vals?o.vals[i]:0;
 if(o.need){const sel=new Set([...idx].sort((a,b)=>v(b)-v(a)).slice(0,o.need));return setTimeout(()=>o.done(sel),500)}
 const k=o.bk=='low'?[...idx].sort((a,b)=>v(a)-v(b))[0]:o.bk=='high'?[...idx].sort((a,b)=>v(b)-v(a))[0]:o.bk=='rand'?idx[Math.random()*idx.length|0]:idx[0];setTimeout(()=>o.cb(k),500)}
function botDiscard(pi,n,cb){const p=G.ps[pi];for(let k=0;k<n;k++){const c=[...p.hand].sort((a,b)=>cv(a)-cv(b))[0];if(c){p.hand.splice(p.hand.indexOf(c),1);G.grave.push(c)}}render();setTimeout(cb,300)}
function botResp(pi,top,o){if(!['hard','imp'].includes(G.lv)||!o.length)return null;const f=id=>o.find(x=>x.c.id==id),hit=top.atk&&top.tg&&top.tg.i==pi;
 if(top.fx===undefined&&top.s!==undefined)return o[0];
 if(top.atk&&top.c.t=='s'&&top.pi!=pi)return f('espejismo_de_la_corona')||f('orden_de_reposo')||f('barricada_real')||null;
 if(hit)return o.find(x=>x.c.t=='d')||f('espejismo_de_la_corona')||f('maniobra_real')||f('orden_de_reposo')||f('barricada_real')||null;
 if(top.c.id=='titiritero_del_reino'&&top.tg&&top.tg.i==pi)return f('orden_de_reposo')||f('barricada_real')||null;
 if(G.lv=='imp'&&top.pi!=pi&&top.c.t=='m'&&['edicto_de_la_corte','usurpador_de_tumbas','titiritero_del_reino'].includes(top.c.id))return f('orden_de_reposo')||f('barricada_real')||null;
 if(top.c.t=='m'&&top.pi!=pi&&['tributo_al_rey','pacto_del_consejo'].includes(top.c.id))return f('ecos_del_reino')||null;return null}
